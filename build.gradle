buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        google()
    }
    dependencies {

    }
}

plugins {
    id "org.jetbrains.kotlin.jvm" version "2.1.0"
    id 'com.github.gmazzo.buildconfig' version "5.5.0"
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.1.0'
}

configurations {
    tools
}

dependencies {
    tools "com.badlogicgames.gdx:gdx-tools:1.13.1"
    tools "com.badlogicgames.gdx:gdx-backend-lwjgl3:1.13.1"
    tools "com.badlogicgames.gdx:gdx-platform:1.13.1:natives-desktop"
}

task packEffects(type: JavaExec) {
    classpath = configurations.tools
    mainClass = 'com.badlogic.gdx.tools.texturepacker.TexturePacker'
    args = [
        file('build/tmp/effects-packed-input').absolutePath,
        file('core/assets/gfx/models/effects').absolutePath,
        'effects'
    ]
}

allprojects {
    apply plugin: "eclipse"
    apply plugin: "java"
    apply plugin: "kotlin"
    apply plugin: 'com.github.gmazzo.buildconfig'

    version = '1.0'
    ext {
        appName = "hm-defense"
        gdxVersion = '1.13.1'
        ktxVersion = '1.13.1-rc1'
        tweenVersion = '6.3.3'
        aiVersion = '1.8.2'
    }

    tasks.withType(Jar).configureEach {
        duplicatesStrategy 'exclude'
    }

    repositories {
        mavenLocal()
        mavenCentral()
        google()
        gradlePluginPortal()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
        maven { url 'https://jitpack.io' }
    }
}

project(":desktop") {
    apply plugin: "java-library"

    dependencies {
        implementation project(":core")
        api "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        api "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
    }
}

project(":core") {
    apply plugin: "java-library"
    apply plugin: "org.jetbrains.kotlin.plugin.serialization"

    sourceSets {
        test.kotlin.srcDirs = ["src/test/kotlin"]
    }

    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"

        api "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"

        // LibKTX: port of LibGDX for Kotlin
        api "io.github.libktx:ktx-app:$ktxVersion"
        api "io.github.libktx:ktx-actors:$ktxVersion"
        api "io.github.libktx:ktx-assets:$ktxVersion"
        api "io.github.libktx:ktx-box2d:$ktxVersion"
        api "io.github.libktx:ktx-graphics:$ktxVersion"
        api "io.github.libktx:ktx-log:$ktxVersion"
        api "io.github.libktx:ktx-math:$ktxVersion"
        api "io.github.libktx:ktx-preferences:$ktxVersion"
        api "io.github.libktx:ktx-scene2d:$ktxVersion"

        // Universal Tween Engine: simplify animations
        api "org.mini2Dx:universal-tween-engine:$tweenVersion"

        // LibGDX AI: behavior trees, steering behaviors
        api "com.badlogicgames.gdx:gdx-ai:$aiVersion"

        // JSON (de)serialization
        implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'

        // Test dependencies
        testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:2.1.0"
        testImplementation "org.junit.jupiter:junit-jupiter:5.10.0"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"

        // Headless LibGDX backend for tests needing Vector2, Gdx.files, etc.
        testImplementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
        testImplementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        testImplementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
    }

    test {
        useJUnitPlatform()
    }
}
